<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>廣東話粗口生成器 (Powered by Cloudflare Workers AI)</title>
    <link rel="stylesheet" href="/templates/style.css">
</head>
<body>

<div class="wrapper">
    <div class="container">
        <h1>廣東話粗口製造機</h1>
        <p class="subtitle">Powered by Cloudflare Workers AI · Gemma 4</p>
        
        <textarea id="inputText" placeholder="輸入句子，例如：你好聰明啊"></textarea>
        
        <div id="profanityCounter" class="profanity-counter">目前粗口：0 個</div>
        
        <br>
        
        <button id="insertBtn" onclick="addProfanity()">增加粗口 🤬</button>
        
        <div class="loading" id="loadingMsg">幫緊你...幫緊你...</div>
    </div>

    <div class="history-column">
        <div class="history-title">📜 歷史紀錄</div>
        <div id="historyList">
            <!-- 歷史卡片會顯示在這裡 -->
        </div>
    </div>
</div>

<script>
    let profanityCount = 0;

    // 用戶手動修改文字時重置計數
    document.getElementById('inputText').addEventListener('input', function () {
        profanityCount = 0;
        document.getElementById('profanityCounter').textContent = '目前粗口：0 個';
    });

    async function addProfanity() {
        const textArea = document.getElementById('inputText');
        const btn = document.getElementById('insertBtn');
        const loading = document.getElementById('loadingMsg');
        const counter = document.getElementById('profanityCounter');
        const originalText = textArea.value;

        if (!originalText.trim()) {
            alert("請先輸入文字！");
            return;
        }

        btn.disabled = true;
        loading.style.display = 'block';

        try {
            const response = await fetch('/insert_profanity', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ text: originalText, profanity_count: profanityCount }),
            });

            const data = await response.json();

            if (data.result) {
                addHistoryCard(originalText, profanityCount); // 將舊版本加入歷史紀錄
                textArea.value = data.result;
                profanityCount++;
                counter.textContent = `目前粗口：${profanityCount} 個`;
            } else if (data.error) {
                alert("錯誤: " + data.error);
            }
        } catch (error) {
            console.error('Error:', error);
            alert("發生錯誤，請檢查網絡或 Cloudflare 設定");
        } finally {
            btn.disabled = false;
            loading.style.display = 'none';
            // 自動聚焦回輸入框，方便用戶連續點擊
            textArea.focus();
        }
    }

    function addHistoryCard(text, count) {
        const list = document.getElementById('historyList');
        const card = document.createElement('div');
        card.className = 'history-card';
        
        const contentDiv = document.createElement('div');
        contentDiv.className = 'history-content';
        contentDiv.textContent = text; // 使用 textContent 防止 XSS
        
        const metaDiv = document.createElement('div');
        metaDiv.className = 'history-meta';
        metaDiv.textContent = `粗口：${count} 個`;
        
        card.appendChild(contentDiv);
        card.appendChild(metaDiv);
        
        list.prepend(card); // 新的卡片加在最上面
    }
</script>

</body>
</html>
